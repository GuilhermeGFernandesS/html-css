<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>Tente abrir esse site em dispositivos diferente ou diminua e aumente o tamanho do navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/pequeno.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/media.png" type="image/png">
        <img src="imagens/grande.png" alt="grande">
    </picture>
    <h2>Reproduzindo aúdios em html5</h2>
    <p>Vamos reproduzir aúdios em html </p>
    <audio preload="metadata" controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="midia/ogg">
        <source src="midia/guanacast-33.wave" type="midia/wave">
        <p>Infelizmente seu navegador não reproduz aúdio</p>
    </audio>
</body>
</html>
