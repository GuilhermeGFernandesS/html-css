<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela02</title>
    <style>
        body{
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            
            border-collapse: collapse;
            width: 800px;
            text-align: center;
        }
        thead{
          
            background-color: #8b8b8b;
            color: white;
        }
        thead, th{
              border: 1px solid black;
            font-size: 1.2em;
            padding: 10px;
        }
        td, tr{
            border: 1px solid black;
            padding: 10px;
        }
        .media{
            background-color: #8b8b8b;
            color: white;
            text-align: left;
        }
        .num{
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th>Área</th>
            <th>Disciplinas</th>
            <th>Notas</th>
            <th>Média</th>
        </thead>
        <tr>
            <td rowspan="4">Exatas</td>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>

        </tr>
        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr class="media">
            <td colspan="3">Média de Exatas</td>
            <td class="num">0.0</td>
        </tr>
        <tr>
            <td rowspan="2">Humanas</td>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr class="media">
            <td colspan="3">Média de Humanas</td>
            <td class="num">0.0</td>
        </tr>
    </table>
</body>
</html>
